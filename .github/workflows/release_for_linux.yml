name: Release for Linux

# 目前只支持手动触发（Actions 页面 Run workflow）。
#
# 原先这里还有一个 push tags 触发，filter 写作 "v[0-9]+.[0-9]+.[0-9]+"。GitHub Actions
# 的 tag filter 是 glob 而不是正则，`[0-9]` 只能匹配一个字符、`+` 是字面量，所以这个
# filter 从来不会命中任何真实 tag，该工作流历史上 0 次运行。与其留一个不可能触发的
# 触发器误导人，不如去掉，让配置如实反映"只能手动跑"。
#
# 注意：这个工作流目前**并不能跑通**，恢复自动触发前需要先修下面几处，否则每次发版
# 都会失败：
#   1. `tag_name: ${{ github.event.inputs.tag_name }}` —— push 事件下该值恒为空；
#      若改回手动触发，也要先在 on.workflow_dispatch.inputs 里声明同名 input。
#   2. `secrets.RELEASE_TOKEN` —— 本仓库并不存在这个 secret，应改用内置 GITHUB_TOKEN，
#      并在 job 上声明 `permissions: { contents: write }`。
#   3. ubuntu-latest 上没有 `7z`，打包步骤需要先 `sudo apt install -y p7zip-full`。
#   4. `actions/checkout` 需要 `submodules: recursive`，否则拿不到 `.flutter/`，
#      `flutter build` 必然失败。
on:
  workflow_dispatch:

jobs:
  build_deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build-essential
        run: |
          sudo apt update
          sudo apt install build-essential
          sudo apt install ninja-build
          sudo apt install -y libgtk-3-dev libfuse2
          java -version

      - name: Install appimagetool
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mv appimagetool /usr/local/bin/

      - name: Install Flutter
        run: |
          git submodule update --init --recursive

      - name: Prepare Flutter Dependencies
        run: |
          .flutter/bin/flutter config --no-analytics
          .flutter/bin/flutter pub get

      - name: Build Linux Tarball
        run: |
          .flutter/bin/flutter build linux --release

      - name: Package Linux Tarball
        run: 7z a -r "../../../../../build/app/watermeter-linux-release-amd64.zip" *
        working-directory: build/linux/x64/release/bundle

      - name: Upload Linux Tarball
        uses: actions/upload-artifact@v4
        with:
          name: Watermeter_Linux
          path: build/app/watermeter-linux-release-amd64.zip

      - name: Release Linux Tarball
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/watermeter-linux-release-amd64.zip
          prerelease: false
          tag_name: ${{ github.event.inputs.tag_name }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Build Appimage
        run: |
          export PATH=$PATH:$PWD/.flutter/bin/
          dart pub global activate fastforge
          export PATH=$PATH:$HOME/.pub-cache/bin
          fastforge package --platform=linux --targets=appimage

      - name: Find Appimage Executable
        run: |
          export dir=$(find ./ -name watermeter-*)
          cp $dir ./watermeter.Appimage
          
      - name: Upload Appimage
        uses: actions/upload-artifact@v4
        with:
          name: Watermeter_Appimage
          path: watermeter.Appimage

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: watermeter.Appimage
          prerelease: false
          tag_name: ${{ github.event.inputs.tag_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
